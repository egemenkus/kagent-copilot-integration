apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: copilot-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/REPO_OWNER/REPO_NAME.git'
    targetRevision: HEAD
    path: apps/copilot-gateway/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
