apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: copilot-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/egemenkus/kagent-copilot-integration.git'
    targetRevision: HEAD
    path: apps/copilot-gateway
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
