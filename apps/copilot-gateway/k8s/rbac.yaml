apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-gateway-sa
  namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: copilot-gateway-provisioner
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kagent.dev"]
    resources: ["modelconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: copilot-gateway-provisioner-binding
subjects:
  - kind: ServiceAccount
    name: copilot-gateway-sa
    namespace: kagent
roleRef:
  kind: ClusterRole
  name: copilot-gateway-provisioner
  apiGroup: rbac.authorization.k8s.io
