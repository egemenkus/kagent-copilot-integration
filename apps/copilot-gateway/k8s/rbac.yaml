apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-gateway-sa
  namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copilot-gateway-role
  namespace: kagent
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: copilot-gateway-rb
  namespace: kagent
subjects:
- kind: ServiceAccount
  name: copilot-gateway-sa
  namespace: kagent
roleRef:
  kind: Role
  name: copilot-gateway-role
  apiGroup: rbac.authorization.k8s.io
