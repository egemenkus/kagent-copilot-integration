apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-rotator-sa
  namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copilot-session-manager
  namespace: kagent
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: copilot-session-manager-binding
  namespace: kagent
subjects:
- kind: ServiceAccount
  name: copilot-rotator-sa
  namespace: kagent
roleRef:
  kind: Role
  name: copilot-session-manager
  apiGroup: rbac.authorization.k8s.io
