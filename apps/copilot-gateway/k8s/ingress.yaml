apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copilot-gateway-ingress
  namespace: kagent
  annotations:
    ingress.class: nginx
spec:
  rules:
  - host: login.kagent.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: copilot-gateway-svc
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent-chat-ingress
  namespace: kagent
  annotations:
    ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: "http://copilot-gateway-svc.kagent.svc.cluster.local:8080/api/auth/verify"
    nginx.ingress.kubernetes.io/auth-signin: "http://login.kagent.local/?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-User"
    # Çerezin ve orijinal isteğin auth servisine iletilmesini garanti eder:
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host login.kagent.local;
spec:
  rules:
  - host: chat.kagent.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kagent-ui
            port:
              number: 8080
