apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-gateway
  namespace: kagent
  labels:
    app.kubernetes.io/name: copilot-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-gateway
    spec:
      serviceAccountName: copilot-gateway-sa
      volumes:
      - name: app-source
        configMap:
          name: copilot-gateway-source
      - name: shm-memory
        emptyDir:
          medium: Memory
      containers:
      - name: copilot-proxy
        image: python:3.11-alpine
        command: ["python3", "-u", "/app/proxy_server.py"]
        env:
        - name: PORT
          value: "8080"
        - name: REDIRECT_URI
          value: "http://localhost:8080/auth/callback"
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: copilot-oauth-credentials
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: copilot-oauth-credentials
              key: client-secret
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: app-source
          mountPath: /app
        - name: shm-memory
          mountPath: /dev/shm
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
