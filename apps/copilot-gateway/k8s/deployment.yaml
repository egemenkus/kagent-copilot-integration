apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-gateway
  namespace: kagent
  labels:
    app.kubernetes.io/name: copilot-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-gateway
    spec:
      serviceAccountName: copilot-rotator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: shared-tokens
        emptyDir:
          medium: Memory
      - name: gateway-scripts
        configMap:
          name: copilot-gateway-scripts
          defaultMode: 0555
      containers:
      - name: auth-rotator
        image: python:3.11-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: shared-tokens
          mountPath: /dev/shm
        - name: gateway-scripts
          mountPath: /app
        command: ["python3", "-u", "/app/auth_rotator.py"]

      - name: copilot-proxy
        image: python:3.11-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: shared-tokens
          mountPath: /dev/shm
          readOnly: true
        - name: gateway-scripts
          mountPath: /app
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        command: ["python3", "-u", "/app/proxy_server.py"]
