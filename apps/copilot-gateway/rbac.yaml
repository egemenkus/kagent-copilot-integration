apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-gateway-sa
  namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: copilot-gateway-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "put"]
  - apiGroups: ["kagent.dev"]
    resources: ["modelconfigs", "agents"]
    verbs: ["get", "list", "create", "update", "put"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: copilot-gateway-rolebinding
subjects:
  - kind: ServiceAccount
    name: copilot-gateway-sa
    namespace: kagent
roleRef:
  kind: ClusterRole
  name: copilot-gateway-role
  apiGroup: rbac.authorization.k8s.io
