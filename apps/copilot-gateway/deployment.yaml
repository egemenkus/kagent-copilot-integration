apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-gateway
  namespace: kagent
  labels:
    app.kubernetes.io/name: copilot-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-gateway
    spec:
      serviceAccountName: copilot-gateway-sa
      volumes:
      - name: app-source
        configMap:
          name: copilot-gateway-source
      - name: shm-memory
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      containers:
      - name: copilot-proxy
        image: python:3.11-alpine
        command: ["sh", "-c", "pip install --no-cache-dir requests && python3 -u /app/proxy_server.py"]
        env:
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: app-source
          mountPath: /app
        - name: shm-memory
          mountPath: /dev/shm
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-gateway-svc
  namespace: kagent
  labels:
    app.kubernetes.io/name: copilot-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: copilot-gateway
