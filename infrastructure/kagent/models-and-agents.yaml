apiVersion: v1
kind: Secret
metadata:
  name: kagent-internal-auth
  namespace: kagent
type: Opaque
stringData:
  api-key: "internal-gateway-token"
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: copilot-cluster-model
  namespace: kagent
spec:
  provider: OpenAI
  model: "gpt-4o"
  apiKeySecret: kagent-internal-auth
  apiKeySecretKey: api-key
  openAI:
    baseUrl: "http://copilot-gateway-svc.kagent.svc.cluster.local:8080/v1"
