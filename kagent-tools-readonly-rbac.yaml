apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-agent-readonly
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "configmaps", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kagent.dev"]
    resources: ["agents", "modelconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tools-readonly
subjects:
  - kind: ServiceAccount
    name: kagent-tools
    namespace: kagent
roleRef:
  kind: ClusterRole
  name: kagent-agent-readonly
  apiGroup: rbac.authorization.k8s.io
